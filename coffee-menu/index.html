<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1ea">
  <title>Зерно — меню кофейни</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="address" href="https://2gis.kz" target="_blank" rel="noopener" title="Открыть на карте">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span class="address-text">
          <b>ул. Панфилова, 98</b>
          <small>Алматы · до 22:00</small>
        </span>
      </a>

      <a class="logo" href="#" aria-label="Кофейня Зерно">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="var(--accent)"/>
          <ellipse cx="24" cy="24" rx="9" ry="13" fill="#fff8f0" transform="rotate(30 24 24)"/>
          <path d="M19 14c5 5 5 15 10 20" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">зерно</span>
      </a>

      <button class="avatar" type="button" aria-label="Профиль">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f6d7b8'/><stop offset='1' stop-color='%23d79a63'/></linearGradient></defs><rect width='64' height='64' fill='url(%23g)'/><circle cx='32' cy='26' r='11' fill='%23fff8f0'/><path d='M12 60c2-12 10-18 20-18s18 6 20 18' fill='%23fff8f0'/></svg>" alt="">
      </button>
    </div>
  </header>

  <main>
    <section class="container today">
      <div class="section-head">
        <h2>Сегодня в меню</h2>
        <span class="today-date" id="todayDate"></span>
      </div>
      <div class="specials" id="specials"></div>
    </section>

    <nav class="tabs-wrap" id="tabsWrap" aria-label="Разделы меню">
      <div class="container">
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
    </nav>

    <section class="container menu" id="menu"></section>
  </main>

  <button class="cart-bar" id="cartBar" type="button" data-order hidden></button>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
